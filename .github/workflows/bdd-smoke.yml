name: ParkEase BDD Smoke Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install behave behave-html-pretty-formatter
      - name: Run @smoke BDD scenarios and generate HTML report
        run: |
          mkdir -p reports
          behave --tags=@smoke -f behave_html_pretty_formatter:PrettyHTMLFormatter -o reports/smoke-report.html -f pretty
      - name: Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parkease-smoke-html-report
          path: reports/smoke-report.html